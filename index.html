<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CAST CERTIFICATE Search Engine | Fast & Secure</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📊 Cast Certificate Search Engine</h1>
            <p>Search by Certificate No, Name, Father's Name, Caste or Address</p>
        </div>

        <!-- Search Box -->
        <div class="search-section">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="🔍 Certificate No / Applicant Name / Father Name / Caste / Address..." autocomplete="off">
                <button id="searchBtn">Search</button>
            </div>
            <div class="search-stats">
                <span id="fileStatus">📁 Loading CSV files...</span>
                <span id="resultCount"></span>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingOverlay" class="loading-overlay" style="display: none;">
            <div class="spinner"></div>
            <p>Searching across files...</p>
        </div>

        <!-- Results Area -->
        <div id="results" class="results-container"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
